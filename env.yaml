name: eegmusic
channels:
  - defaults
dependencies:
  - python=3.13
  - pip>=20.3
  - pip:
    - numpy
    - matplotlib
    - omegaconf
    - einops
    - --extra-index-url https://download.pytorch.org/whl/cu118
    - torch-fidelity
    - torch
    - torchvision
    - torchaudio
    - Pillow
    - tqdm
    - wandb
    - torchmetrics
    - scikit-image
    - diffusers
    - accelerate
    - transformers=4.49.0
    - moviepy 
    - imageio
    - pandas
    - scikit-learn
    - datasets
    - librosa
    - seaborn
    - timm
    - h5py
    - tensorboardX
    - umap-learn
    - -e .
    